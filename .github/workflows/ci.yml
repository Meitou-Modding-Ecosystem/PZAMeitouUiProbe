name: CI
on:
  pull_request:
    branches: [master, beta, main, release]
  push:
    branches: [master, beta, main, release]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/build-ui.yml@fc0507fb376b8b8ba732795c7032c9cd81464a58
  release-readiness:
    name: Release readiness
    if: always()
    needs: [compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all prerequisite checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python - <<'PYCODE'
          import os
          results = os.environ['RESULTS'].split(',')
          if not results or any(result != 'success' for result in results):
              raise SystemExit('A required check failed, was cancelled, or was skipped')
          PYCODE
